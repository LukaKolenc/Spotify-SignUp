<!DOCTYPE html>
<html lang="sl">

<head>
    <meta charset="UTF-8">
    <title>Spotify - Registracija</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <a href="https://fonts.google.com/specimen/Roboto"></a>
</head>

<body>

    <header class="glava">
        <div class="logo">
            <svg class="logo-ikona" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="12" fill="#1ed760" />
                <path d="M5.2 8.6c4.4-1.3 9.4-.9 13.4 1.4" stroke="#000" stroke-width="2" fill="none"
                    stroke-linecap="round" />
                <path d="M5.9 12.3c3.7-1 7.9-.7 11.2 1.2" stroke="#000" stroke-width="1.7" fill="none"
                    stroke-linecap="round" />
                <path d="M6.6 15.7c3-.8 6.1-.5 8.8 1" stroke="#000" stroke-width="1.4" fill="none"
                    stroke-linecap="round" />
            </svg>
            <span class="logo-besedilo">Spotify</span>
        </div>
    </header>

    <main id="kartica">
        <h1>Z registracijo zacni poslusati</h1>

        <form method="get">
            <div id="levi">
                <div class="polje">
                    <label for="email">E-poštni naslov</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="polje">
                    <label for="geslo">Geslo</label>
                    <input type="password" id="geslo" name="geslo" minlength="8" required>
                    <div class="namig">Geslo naj ima vsaj 8 znakov.</div>
                </div>

                <div class="polje">
                    <label for="ime">Ime profila</label>
                    <input type="text" id="ime" name="ime" required>
                    <div class="namig">To ime se bo prikazalo na tvojem profilu.</div>
                </div>

                <div class="polje">
                    <span class="oznaka" id="rojstvo-oznaka">Datum rojstva</span>
                    <div class="datum" role="group" aria-labelledby="rojstvo-oznaka">
                        <div class="datum-dan">
                            <label for="dan" class="skrito">Dan</label>
                            <input type="number" id="dan" name="dan" min="1" max="31" placeholder="DD" required>
                        </div>
                        <div class="datum-mesec">
                            <label for="mesec" class="skrito">Mesec</label>
                            <select id="mesec" name="mesec" required>
                                <option value="" disabled selected>Mesec</option>
                                <option value="1">januar</option>
                                <option value="2">februar</option>
                                <option value="3">marec</option>
                                <option value="4">april</option>
                                <option value="5">maj</option>
                                <option value="6">junij</option>
                                <option value="7">julij</option>
                                <option value="8">avgust</option>
                                <option value="9">september</option>
                                <option value="10">oktober</option>
                                <option value="11">november</option>
                                <option value="12">december</option>
                            </select>
                        </div>
                        <div class="datum-leto">
                            <label for="leto" class="skrito">Leto</label>
                            <input type="number" id="leto" name="leto" min="1900" max="2012" placeholder="LLLL"
                                required>
                        </div>
                    </div>
                </div>

                <div class="polje">
                    <span class="oznaka" id="spol-oznaka">Spol</span>
                    <div class="spol" role="radiogroup" aria-labelledby="spol-oznaka">
                        <label class="izbira">
                            <input type="radio" name="spol" value="zenska" required>
                            <span>Ženska</span>
                        </label>
                        <label class="izbira">
                            <input type="radio" name="spol" value="moski">
                            <span>Moški</span>
                        </label>
                        <label class="izbira">
                            <input type="radio" name="spol" value="drugo">
                            <span>Drugo</span>
                        </label>
                    </div>
                </div>

                <div class="desni">

                    <div class="potrditve">
                        <label class="potrdi">
                            <input type="checkbox" name="partnerji">
                            <span>Svoje registracijske podatke deli z ponudniki vsebine za namene trženja.</span>
                        </label>
                        <label class="potrdi">
                            <input type="checkbox" name="pogoji" required>
                            <span>Strinjam se s pogoji uporabe in politiko zasebnosti.</span>
                        </label>
                    </div>

                    <button type="submit" class="gumb">Registracija</button>

                    <div class="locilo"><span>ali</span></div>

                    <div class="druzbena">
                        <button type="button" class="gumb-rob">
                            Registracija z Googlom
                        </button>
                        <button type="button" class="gumb-rob">
                            Registracija s Facebookom
                        </button>
                    </div>

                    <div class="prijava">
                        Že imaš račun? <a href="#">Prijava tukaj</a>.
                    </div>
                </div>
            </div>
        </form>
    </main>






</body>

</html>
